<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ember Depths</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#ebe5f2;--pn:#fbf8ff;--p2:#ece5f6;--tx:#251e36;--mu:#6a6285;--bd:#c6bbd9;--ac:#b8452c}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15111f;--pn:#1f1a2e;--p2:#2a2340;--tx:#ebe6f7;--mu:#9d95b8;--bd:#3d3459;--ac:#ff8a5c}}
:root[data-theme="dark"]{--bg:#15111f;--pn:#1f1a2e;--p2:#2a2340;--tx:#ebe6f7;--mu:#9d95b8;--bd:#3d3459;--ac:#ff8a5c}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;touch-action:none;user-select:none}
button{font:inherit;color:var(--tx);background:var(--p2);border:1px solid var(--bd);border-radius:6px;padding:5px 11px;cursor:pointer}
button:hover{border-color:var(--ac)}button:focus-visible{outline:2px solid var(--ac)}button.a{border-color:var(--ac);font-weight:700}
button.go{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:700;padding:7px 16px}
input,textarea,select{font:inherit;color:var(--tx);background:var(--p2);border:1px solid var(--bd);border-radius:6px;padding:4px 7px;user-select:text}
textarea{width:100%;margin-top:8px;font:11px monospace}
.sp{flex:1}.mu,small{color:var(--mu)}.c{text-align:center}p{margin:6px 0}
#hud{display:none;flex-wrap:wrap;gap:4px 12px;align-items:center;padding:5px 10px;background:var(--pn);border-bottom:1px solid var(--bd)}
#hud .t{font:700 16px Georgia,serif}
#hpw,#xpw{position:relative;background:var(--p2);border:1px solid var(--bd);overflow:hidden}
#hpw{width:150px;height:16px;border-radius:8px}#xpw{width:90px;height:8px;border-radius:4px}
#hp{height:100%;background:#d9503f}#xp{height:100%;background:#e3b02a}
#ht{position:absolute;inset:0;text-align:center;font-size:11px;line-height:16px;color:#fff;text-shadow:0 1px 2px #000}
#spt{color:var(--ac);font-weight:700}
#wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;border:2px solid var(--bd);background:#000;image-rendering:pixelated}
#toast{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);max-width:92vw;background:var(--pn);border:1px solid var(--bd);padding:6px 12px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;text-align:center}
#toast.on{opacity:1}
.ic{display:block;width:48px;height:48px;background-repeat:no-repeat;image-rendering:pixelated}.ic.s{width:32px;height:32px;display:inline-block;vertical-align:middle}
/* ability, status and consumable bars */
#ab,#sx{position:fixed;top:calc(70px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:6px;z-index:2}
#ab.left,#sx.left{left:6px}#ab.right,#sx.right{right:6px}
.as{position:relative;width:136px;height:46px;display:grid;grid-template-columns:36px 1fr;align-items:center;background:rgba(20,16,32,.85);border:2px solid var(--c,#555);border-radius:8px;color:#fff;overflow:hidden;padding-right:34px;cursor:pointer;box-shadow:0 0 8px rgba(0,0,0,.4)}
.as b{grid-row:1/3;font-size:20px;text-align:center}.as .n{font-size:11px;font-weight:700;line-height:1.1}.as u{font-size:10px;text-decoration:none;opacity:.7}
.as .k{position:absolute;top:1px;left:3px;font-size:9px;opacity:.85}.as .cd{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(0,0,0,.68)}
.as em{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-style:normal;font-weight:700;font-size:13px;text-shadow:0 1px 2px #000}.as.e{opacity:.35;border-style:dashed}
.st{position:relative;width:38px;height:38px;border:2px solid var(--c);border-radius:6px;background:rgba(20,16,32,.88)}.st.bad{border-style:dashed}.st i{display:block;width:32px;height:32px;margin:1px;background-repeat:no-repeat;image-rendering:pixelated}
.st em{position:absolute;right:1px;bottom:-1px;font:700 11px system-ui;font-style:normal;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000}
#cb{position:fixed;bottom:calc(8px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:2}
.cs{position:relative;width:44px;height:44px;border:2px solid var(--bd);border-radius:6px;background:rgba(20,16,32,.88);cursor:pointer;color:#fff}.cs.e{opacity:.45}
.cs .ic{width:32px;height:32px;margin:4px}.cs .k{position:absolute;top:0;left:3px;font-size:10px;opacity:.85}.cs b{position:absolute;right:3px;bottom:0;font-size:11px;text-shadow:0 0 3px #000}
@media(max-width:620px){.as{width:44px;padding:0}.as .n,.as u{display:none}.as b{grid-column:1/3}.as em{right:2px;font-size:11px}}
/* overlays and panels */
.ov{position:fixed;inset:0;background:rgba(8,6,16,.78);display:none;align-items:center;justify-content:center;z-index:5;padding:max(8px,env(safe-area-inset-top,0px)) 8px max(8px,env(safe-area-inset-bottom,0px))}
.ov.on{display:flex}
.pn{background:var(--pn);border:1px solid var(--bd);border-radius:10px;width:min(100%,480px);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.pn.big{width:min(100%,640px)}.pn.wide{width:min(100%,700px)}.pn.sg{width:min(100%,760px);height:100%}
.hd{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--bd);font:17px Georgia,serif}
.mb{padding:12px;overflow:auto}.mcol{display:flex;flex-direction:column;gap:8px}
.srow{display:flex;gap:8px;justify-content:space-between;align-items:center;padding:5px 0;flex-wrap:wrap}
.ttl{font:700 36px Georgia,serif;text-align:center;padding:14px 8px 0;color:var(--ac)}
.slot{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--bd)}.slot .si{flex:1}.slot .sb{display:flex;flex-direction:column;gap:6px}
.pt{width:64px;height:80px;border-radius:6px;border:1px solid var(--bd);background:#1b1626;image-rendering:pixelated;flex:none}.pt.e{opacity:.4}
.bdg{font-size:11px;padding:1px 7px;border-radius:8px;background:var(--p2);border:1px solid var(--bd)}.bdg.easy{color:#3fa870}.bdg.hard{color:#d88a2a}.bdg.hardcore{color:#e0483a}.bdg.sandbox{color:#4a8ee0}
#mm .srow{padding:10px 14px;border-top:1px solid var(--bd)}
.ccb{display:flex;gap:16px;padding:12px;overflow:auto;flex-wrap:wrap}.pv{display:flex;flex-direction:column;gap:8px;align-items:center}
#pvc{width:128px;height:160px;border:1px solid var(--bd);border-radius:8px;cursor:pointer}.opts{flex:1;min-width:250px}.lb{margin-top:8px;font-weight:700}
.chs,.sw{display:flex;flex-wrap:wrap;gap:5px;margin:3px 0;align-items:center}.sw i{width:26px;height:26px;border-radius:50%;border:2px solid var(--bd);cursor:pointer}.sw i.a{border-color:var(--tx);box-shadow:0 0 0 2px var(--ac)}
input[type=color]{width:36px;height:28px;padding:0;border:1px solid var(--bd);background:none;cursor:pointer}.hx{width:84px;font-family:monospace}
.foot{padding:10px 12px;border-top:1px solid var(--bd);text-align:right}
/* inventory */
#ib{overflow:auto;flex:1}.eq{padding:8px 12px;border-bottom:1px solid var(--bd);font-size:13px}
.ibody{display:flex;gap:16px;padding:10px 12px;flex-wrap:wrap}.lcol{width:166px}.rcol{flex:1;min-width:250px}
.doll{display:grid;grid-template-columns:repeat(3,52px);gap:6px}.row4{display:flex;gap:5px;flex-wrap:wrap}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px;font-size:13px}
.pack{display:grid;grid-template-columns:repeat(7,52px);gap:5px;align-content:start}
.cell{position:relative;width:52px;height:52px;border:2px solid var(--c,var(--bd));border-radius:6px;background:var(--p2);cursor:pointer;overflow:hidden}
.cell .ic{position:absolute;left:0;top:0}.cell.sel{box-shadow:0 0 0 2px var(--ac)}.cell.emp{opacity:.6}.cell.ck{box-shadow:0 0 0 3px #ff6b5e inset}
.cell small{display:flex;align-items:center;justify-content:center;height:100%;text-align:center;line-height:1;font-size:9px;padding:2px}
.cell u{position:absolute;right:3px;bottom:0;font-size:10px;text-decoration:none;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000}.cell .bg{position:absolute;left:1px;top:0;font-size:12px}
.cell .fv{position:absolute;right:2px;top:-1px;color:#ffd24a;font-size:12px;text-shadow:0 0 3px #000}.fv2{color:#4fc98a}
s.pr{position:absolute;left:0;right:0;bottom:0;text-align:center;font-size:10px;background:rgba(0,0,0,.7);color:#ffd24a;text-decoration:none}
#det,#sdet{padding:10px 12px;border-top:1px solid var(--bd);min-height:110px;font-size:13px}.dh{font-size:15px}
.ghost{position:fixed;width:48px;height:48px;pointer-events:none;z-index:50;opacity:.85}
.dlg{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--bd)}.dlg canvas{width:64px;height:64px;border-radius:8px;flex:none}.shg{padding:10px 12px;grid-template-columns:repeat(8,52px)}
.mats{display:flex;gap:12px;flex-wrap:wrap}#fg .pack{margin:8px 0}#fg .mb{overflow:auto}
/* skill trees */
.sgb{display:flex;flex:1;min-height:0}#sc{flex:1;overflow:auto;background:radial-gradient(ellipse at 50% 0,var(--p2),transparent 70%)}
#tr{position:relative;width:360px;height:960px;margin:0 auto}#tr svg{position:absolute;inset:0;pointer-events:none}
#tr path{fill:none;stroke:var(--bd);stroke-width:3;stroke-linecap:round}#tr path.on{stroke:var(--c);filter:drop-shadow(0 0 4px var(--c))}
.tt{position:absolute;transform:translateX(-50%);font:700 20px Georgia,serif;color:var(--c);white-space:nowrap}
.lh{position:absolute;top:80px;transform:translateX(-50%);width:112px;text-align:center;font-size:12px;line-height:1.2}.lh small{display:block}
.nd{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;padding:3px;border:2px solid var(--bd);border-radius:8px;background:var(--p2)}
.nd i{display:block;width:48px;height:48px;background-repeat:no-repeat;image-rendering:pixelated}
.nd b{position:absolute;right:3px;bottom:1px;font-size:10px;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000}
.nd span{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:2px;width:112px;text-align:center;font-size:10px;line-height:1.1;color:var(--mu);pointer-events:none}
.nd.ks{width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:12px}.nd.ks i{margin:5px}
.nd.own{border-color:var(--c);box-shadow:0 0 12px var(--c);background:var(--pn)}.nd.ok{border-color:var(--c);box-shadow:0 0 10px var(--c),inset 0 0 8px var(--c)}.nd.sp{border-color:var(--c);opacity:.8}
.nd.floor,.nd.req,.nd.tree{opacity:.4;filter:grayscale(.7)}.nd.sel{outline:2px solid var(--ac);outline-offset:2px}
.lw{position:absolute;left:0;right:0;top:46px;text-align:center;padding:4px 10px;background:rgba(0,0,0,.55);color:#fff;border-radius:6px;font-size:12px;z-index:2}
#opt{width:232px;overflow:auto;border-left:1px solid var(--bd);padding:10px;display:flex;flex-direction:column;gap:8px;flex:none}
.lvb{display:flex;flex-direction:column;gap:3px}.xb{height:8px;background:var(--p2);border:1px solid var(--bd);border-radius:4px;overflow:hidden}.xb div{height:100%;background:#e3b02a}.spb{font-weight:700;color:var(--ac)}
.tl{display:flex;flex-wrap:wrap;gap:4px}.tb{display:flex;align-items:center;gap:4px;padding:2px 6px 2px 2px;border-color:transparent;font-size:12px}.tb.a{border-color:var(--c);font-weight:700}.tb.lk{opacity:.6}
.tb i{display:block;width:32px;height:32px;background-repeat:no-repeat;image-rendering:pixelated}
.nh{display:flex;gap:8px;align-items:center}.nh i{display:block;width:48px;height:48px;background-repeat:no-repeat;image-rendering:pixelated;flex:none;border:2px solid var(--c);border-radius:8px;background-color:var(--p2)}
@media(max-width:700px){.sgb{flex-direction:column-reverse}#opt{width:auto;max-height:42%;border-left:0;border-top:1px solid var(--bd)}}
/* touch controls */
#tc{display:none;position:fixed;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:0;right:0;justify-content:space-between;align-items:flex-end;padding:0 14px;pointer-events:none;z-index:3}
#tc>*{pointer-events:auto}@media(pointer:coarse){#tc{display:flex}}
#js{width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center}
#jk{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.4)}
#bt{display:grid;grid-template-columns:repeat(2,56px);gap:8px}#bt button{height:56px;border-radius:50%;font-size:20px;padding:0;background:rgba(40,30,60,.78);color:#fff}
</style></head><body>
<div id="hud"><span class="t">Ember Depths</span><span id="nm"></span><b id="lv"></b><div id="hpw"><div id="hp"></div><span id="ht"></span></div><div id="xpw" title="Experience"><div id="xp"></div></div><span id="fl"></span><b id="gd"></b><span id="spt"></span><span class="sp"></span><button id="bs">Skills (T)</button><button id="bi">Pack (I)</button><button id="bm">Menu</button></div>
<div id="wrap"><canvas id="cv"></canvas></div>
<div id="ab" class="left"></div><div id="sx" class="right"></div><div id="cb"></div>
<div id="toast"></div>
<div id="tc"><div id="js"><div id="jk"></div></div><div id="bt"><button data-k="atk">⚔</button><button data-k="rng">🏹</button><button data-k="dash">⇢</button><button data-k="use">✋</button></div></div>
<div class="ov" id="mm"></div>
<div class="ov" id="cc"></div>
<div class="ov" id="md"></div>
<div class="ov" id="dv"></div>
<div class="ov" id="sv"><div class="pn sg"><div class="hd"><span>Skill trees</span><span class="sp"></span><button data-x>Close</button></div><div class="sgb"><div id="sc"><div id="tr"></div></div><div id="opt"></div></div></div></div>
<div class="ov" id="iv"><div class="pn wide"><div class="hd"><span>Pack and gear</span><span class="sp"></span><button data-x>Close</button></div><div id="ib"></div></div></div>
<div class="ov" id="shp"></div>
<div class="ov" id="fg"></div>
<script src="sprites/atlas.js"></script>
<script src="js/data.js"></script>
<script src="js/core.js"></script>
<script src="js/world.js"></script>
<script src="js/combat.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body></html>
